name: CI Trilha B

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  commercial-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Gerar base comercial
        run: |
          cp data/raw_sample/DB_LOCADORA.seed.db data/locadora_commercial.db
          python src/commercial/generate_campaigns.py
          python src/commercial/generate_funnel_events.py
      - name: Validar dados comerciais
        run: python src/validation/validate_commercial_data.py
      - name: Executar testes
        run: python -m pytest -q